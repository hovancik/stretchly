name: Setup Build Environment
description: Setup Node.js, Python and npm dependencies for Stretchly builds

runs:
  using: composite
  steps:
    - name: Setup macOS
      if: runner.os == 'macOS'
      run: sudo xcode-select -s /Library/Developer/CommandLineTools
      shell: bash
    - name: Setup Linux base dependencies
      if: runner.os == 'Linux'
      run: sudo apt update && sudo apt-get install -y libinput-dev libudev-dev
      shell: bash
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
    - run: pip install setuptools
      shell: bash
    - run: npm install -g npm
      shell: bash
    - run: npm install
      shell: bash
